<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Вход в студию и в кабинет клиента: одна карточка на фоне с мягкой подсветкой, система как в кабинете. */
:root {
  color-scheme: dark;
  --bg: #0B0D12; --surface: #12151C; --surface-2: #191D26; --line: #262B37; --line-strong: #363D4E; --ink: #E9ECF3; --muted: #9098AB;
  --accent: #5B8CFF; --accent-ink: #06122E; --accent-soft: rgba(91, 140, 255, .15); --saffron: #F2B544; --bad: #FF6B6B; --bad-soft: rgba(255, 107, 107, .13);
  --shadow: 0 24px 60px rgba(0, 0, 0, .5);
  --font-display: "Onest", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #F3F4F8; --surface: #FFFFFF; --surface-2: #EEF0F6; --line: #E0E4EC; --line-strong: #CBD1DD; --ink: #121622; --muted: #586074;
    --accent: #2F5BEA; --accent-ink: #FFFFFF; --accent-soft: rgba(47, 91, 234, .10); --saffron: #A15F00; --bad: #CF3434; --bad-soft: rgba(207, 52, 52, .10);
    --shadow: 0 24px 60px rgba(18, 22, 34, .14);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F3F4F8; --surface: #FFFFFF; --surface-2: #EEF0F6; --line: #E0E4EC; --line-strong: #CBD1DD; --ink: #121622; --muted: #586074;
  --accent: #2F5BEA; --accent-ink: #FFFFFF; --accent-soft: rgba(47, 91, 234, .10); --saffron: #A15F00; --bad: #CF3434; --bad-soft: rgba(207, 52, 52, .10);
  --shadow: 0 24px 60px rgba(18, 22, 34, .14);
}
* { box-sizing: border-box; }
body { background: radial-gradient(60% 50% at 50% 0%, var(--accent-soft), transparent 70%), var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
button, input { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.card { animation: card-in .5s cubic-bezier(.2, .8, .2, 1) both; width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 28px 24px; display: grid; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.brand svg { width: 38px; height: 38px; flex: none; }
.brand b { font: 700 17px/1.1 var(--font-display); }
h1 { margin: 0; font: 700 22px/1.25 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.lead { margin: 6px 0 0; color: var(--muted); }
form { display: grid; gap: 14px; }
label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; }
input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; background: var(--bg); font-weight: 500; font-size: 15px; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 12px 16px; font-weight: 700; cursor: pointer; }
.btn[disabled] { opacity: .6; cursor: progress; }
.error { background: var(--bad-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.foot { font-size: 13px; color: var(--muted); text-align: center; }
input { border-color: var(--line-strong); transition: border-color .18s, box-shadow .18s; }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.btn { transition: filter .18s, transform .12s, box-shadow .25s; }
.btn:hover { filter: brightness(1.08); box-shadow: 0 8px 24px var(--accent-soft); }
.btn:active { transform: scale(.98); }
@keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(.98); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<main class="card">
  <a class="brand" href="/">
    <svg viewBox="0 0 38 38" aria-hidden="true">
      <rect x="1" y="1" width="36" height="36" rx="11" fill="var(--accent)"></rect>
      <rect x="11" y="7" width="16" height="24" rx="4" fill="none" stroke="var(--accent-ink)" stroke-width="2"></rect>
      <path d="M17 15.5v7l6-3.5z" fill="var(--saffron)"></path>
    </svg>
    <b>AI-студия</b>
  </a>
  <div id="view"></div>
  <p class="foot"><a href="/">Что такое AI-студия</a></p>
</main>

<script>
(() => {
  const AUTH = window.STUDIO_AUTH || { mode: "login" };
  const view = document.getElementById("view");
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  if (AUTH.mode === "invite-expired") {
    view.innerHTML = `<h1>Ссылка больше не действует</h1>
      <p class="lead">Ссылка-приглашение одноразовая и живёт 7 дней. Попросите студию прислать новую — или войдите, если уже задали пароль.</p>
      <p><a href="/login">Войти в кабинет</a></p>`;
    return;
  }

  const invite = AUTH.mode === "invite";
  view.innerHTML = invite
    ? `<div><h1>Кабинет ${esc(AUTH.company)}</h1><p class="lead">Придумайте пароль — дальше входите по почте <b>${esc(AUTH.email)}</b> и этому паролю.</p></div>
       <form id="form" novalidate>
         <input type="email" name="username" value="${esc(AUTH.email)}" autocomplete="username" hidden>
         <label>Новый пароль<input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="минимум 8 символов"></label>
         <label>Ещё раз<input type="password" name="repeat" required minlength="8" autocomplete="new-password"></label>
         <div class="error" id="error" role="alert" hidden></div>
         <button class="btn" type="submit" id="submit">Открыть кабинет</button>
       </form>`
    : `<div><h1>Вход</h1><p class="lead">Клиенты и сотрудники студии входят по почте, владелец — по логину <b>admin</b>.</p></div>
       <form id="form" novalidate>
         <label>Почта или логин<input name="login" required autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false"></label>
         <label>Пароль<input type="password" name="password" required autocomplete="current-password"></label>
         <div class="error" id="error" role="alert" hidden></div>
         <button class="btn" type="submit" id="submit">Войти</button>
       </form>`;

  const form = document.getElementById("form");
  const error = document.getElementById("error");
  const submit = document.getElementById("submit");
  form.querySelector("input:not([hidden])").focus();

  function fail(text) {
    error.textContent = text;
    error.hidden = false;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    error.hidden = true;
    const data = new FormData(form);
    let body;
    if (invite) {
      const password = String(data.get("password") || "");
      if (password.length < 8) return fail("Пароль — минимум 8 символов");
      if (password !== data.get("repeat")) return fail("Пароли не совпадают");
      body = { token: AUTH.token, password };
    } else {
      body = { login: String(data.get("login") || "").trim(), password: String(data.get("password") || "") };
      if (!body.login || !body.password) return fail("Введите почту и пароль");
    }
    submit.disabled = true;
    try {
      const res = await fetch(invite ? "/api/invite" : "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded", Accept: "application/json" },
        body: new URLSearchParams(body),
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || "Не получилось, попробуйте ещё раз");
      location.href = "/app";
    } catch (e) {
      fail(e.message === "Failed to fetch" ? "Нет связи с сервером" : e.message);
      submit.disabled = false;
    }
  });
})();
</script>
