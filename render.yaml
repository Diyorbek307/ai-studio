# Render: бесплатный веб-сервис (Docker) для старта и демо.
# Заполни STUDIO_ADMIN_PASSWORD; для настоящих роликов — GEMINI_API_KEY. Адрес сервиса Render передаёт сам.
# На бесплатном тарифе нет диска: клиенты, серии и ролики стираются при деплое и после сна сервера
# (засыпает через 15 минут без посещений). Когда пойдут клиенты — переключи на постоянный тариф:
#   plan: starter
#   disk: { name: studio-data, mountPath: /data, sizeGB: 5 }
services:
  - type: web
    name: ai-studio
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STUDIO_SERIES
        value: bozor-seriali
      - key: DAILY_AT
        value: "09:00"
      - key: STUDIO_TZ
        value: Asia/Tashkent
      - key: DAILY_BUDGET_USD
        value: "5"
      - key: EPISODES_PER_DAY
        value: "1"
      - key: STUDIO_ADMIN_PASSWORD
        sync: false
      # Ключ подписи сессий кабинета — Render сгенерирует сам
      - key: STUDIO_SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: HIGGSFIELD_KEY_ID
        sync: false
      - key: HIGGSFIELD_KEY_SECRET
        sync: false
      - key: FAL_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: westeurope
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
